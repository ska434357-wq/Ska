<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b36"/>
      <stop offset="100%" stop-color="#062421"/>
    </linearGradient>
    <linearGradient id="crossGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled content inside 80% safe zone circle (scale 0.72 centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Pharmacy Cross -->
    <rect x="216" y="116" width="80" height="280" rx="24" fill="url(#crossGradMask)"/>
    <rect x="116" y="216" width="280" height="80" rx="24" fill="url(#crossGradMask)"/>

    <!-- Central Pill emblem -->
    <g transform="translate(256,256) rotate(-45)">
      <path d="M -54,-24 C -68,-24 -78,-14 -78,0 C -78,14 -68,24 -54,24 L 0,24 L 0,-24 Z" fill="#ffffff"/>
      <path d="M 0,-24 L 54,-24 C 68,-24 78,-14 78,0 C 78,14 68,24 54,24 L 0,24 Z" fill="#0f766e"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#0b3b36" stroke-width="4"/>
    </g>

    <circle cx="150" cy="150" r="10" fill="#5eead4" opacity="0.8"/>
    <circle cx="362" cy="150" r="10" fill="#5eead4" opacity="0.8"/>
    <circle cx="150" cy="362" r="10" fill="#5eead4" opacity="0.8"/>
    <circle cx="362" cy="362" r="10" fill="#5eead4" opacity="0.8"/>
  </g>
</svg>
