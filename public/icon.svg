<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3b36"/>
      <stop offset="100%" stop-color="#062421"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Pharmacy Cross with shadow -->
  <g filter="url(#glow)">
    <!-- Vertical bar -->
    <rect x="216" y="116" width="80" height="280" rx="24" fill="url(#crossGrad)"/>
    <!-- Horizontal bar -->
    <rect x="116" y="216" width="280" height="80" rx="24" fill="url(#crossGrad)"/>
  </g>

  <!-- Central Pill emblem -->
  <g transform="translate(256,256) rotate(-45)">
    <!-- Pill body left half (white) -->
    <path d="M -54,-24 C -68,-24 -78,-14 -78,0 C -78,14 -68,24 -54,24 L 0,24 L 0,-24 Z" fill="#ffffff"/>
    <!-- Pill body right half (emerald teal) -->
    <path d="M 0,-24 L 54,-24 C 68,-24 78,-14 78,0 C 78,14 68,24 54,24 L 0,24 Z" fill="#0f766e"/>
    <!-- Center divider line -->
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#0b3b36" stroke-width="4"/>
  </g>

  <!-- Medical Sparkle Dots -->
  <circle cx="150" cy="150" r="10" fill="#5eead4" opacity="0.8"/>
  <circle cx="362" cy="150" r="10" fill="#5eead4" opacity="0.8"/>
  <circle cx="150" cy="362" r="10" fill="#5eead4" opacity="0.8"/>
  <circle cx="362" cy="362" r="10" fill="#5eead4" opacity="0.8"/>
</svg>
